{
  "media": {
    "input": "public/media",
    "output": "/media",
    "extensions": [
      "png",
      "jpg",
      "jpeg",
      "webp"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "projects",
      "label": "作品案例（新增／修改／下架）",
      "type": "collection",
      "path": "src/content/projects",
      "format": "json",
      "filename": "{fields.slug}.json",
      "subfolders": false,
      "view": {
        "primary": "brand",
        "fields": [
          "brand",
          "title",
          "category",
          "published"
        ],
        "sort": [
          "order",
          "brand"
        ],
        "default": {
          "sort": "order",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "slug",
          "label": "網址代稱（發布後不要更改）",
          "type": "string",
          "required": true,
          "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        },
        {
          "name": "published",
          "label": "顯示於網站",
          "type": "boolean",
          "required": true,
          "description": "關閉可從網站下架。注意：儲存庫公開，所有儲存的文字與圖片仍可被讀取，請勿儲存未授權原稿。"
        },
        {
          "name": "order",
          "label": "排序（小數字在前）",
          "type": "number",
          "required": true
        },
        {
          "name": "issue",
          "label": "案例編號，例如 01",
          "type": "string",
          "required": true
        },
        {
          "name": "brand",
          "label": "品牌／作品名稱",
          "type": "string",
          "required": true
        },
        {
          "name": "title",
          "label": "案例主標題（可換行）",
          "type": "text",
          "required": true
        },
        {
          "name": "role",
          "label": "參與角色（已確認的工作範圍）",
          "type": "string",
          "required": false
        },
        {
          "name": "category",
          "label": "分類",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "banquet",
                "label": "尾牙春酒"
              },
              {
                "name": "seasonal",
                "label": "節慶餐飲"
              },
              {
                "name": "wedding",
                "label": "婚禮與蜜月"
              }
            ]
          }
        },
        {
          "name": "label",
          "label": "短標籤，例如 春節圍爐 × 內容整合",
          "type": "string",
          "required": true
        },
        {
          "name": "intro",
          "label": "案例介紹",
          "type": "text",
          "required": true
        },
        {
          "name": "audience",
          "label": "目標讀者",
          "type": "string",
          "required": true
        },
        {
          "name": "intent",
          "label": "搜尋主題",
          "type": "string",
          "required": true
        },
        {
          "name": "structure",
          "label": "文章架構",
          "type": "string",
          "required": true,
          "list": {
            "min": 1
          }
        },
        {
          "name": "focus",
          "label": "內容溝通重點",
          "type": "text",
          "required": true,
          "list": {
            "min": 1
          }
        },
        {
          "name": "color",
          "label": "插畫配色",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "sand",
                "label": "米色"
              },
              {
                "name": "slate",
                "label": "灰綠"
              },
              {
                "name": "rust",
                "label": "暖棕"
              },
              {
                "name": "blue",
                "label": "淺藍"
              }
            ]
          }
        },
        {
          "name": "coverImage",
          "label": "自訂封面（不選即使用插畫）",
          "type": "image",
          "required": false,
          "description": "僅上傳有權公開的圖片。"
        },
        {
          "name": "coverAlt",
          "label": "封面圖片說明",
          "type": "string",
          "required": false,
          "description": "上傳圖片時必填，供無法看到圖片的讀者使用。"
        },
        {
          "name": "coverHeading",
          "label": "封面短標題（可換行）",
          "type": "text",
          "required": false
        },
        {
          "name": "coverNote",
          "label": "圖片註記",
          "type": "string",
          "required": false,
          "description": "AI 圖請保留情境示意註記；換成已授權的實景照片時可依實際來源調整。"
        },
        {
          "name": "originalUrl",
          "label": "已驗證原文網址",
          "type": "string",
          "required": false,
          "pattern": "^https://[^\\s]+$",
          "description": "沒有公開網址請留空，不要填私人 Drive 連結。"
        },
        {
          "name": "excerptApproved",
          "label": "已取得此節錄的公開授權",
          "type": "boolean",
          "required": true,
          "description": "只有勾選且填寫節錄才會在網站顯示。"
        },
        {
          "name": "excerpt",
          "label": "可公開的文章節錄",
          "type": "text",
          "required": false,
          "description": "所有儲存內容都會寫入公開儲存庫；未授權內容請不要貼入，即使未勾選上方開關。"
        }
      ]
    },
    {
      "name": "settings",
      "label": "網站名稱、信箱與搜尋描述",
      "type": "file",
      "path": "src/content/settings.json",
      "format": "json",
      "fields": [
        {
          "name": "name",
          "label": "網站名稱",
          "type": "string",
          "required": true
        },
        {
          "name": "email",
          "label": "合作信箱",
          "type": "string",
          "required": true,
          "pattern": "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        },
        {
          "name": "description",
          "label": "搜尋結果與社群分享描述",
          "type": "text",
          "required": true
        }
      ]
    },
